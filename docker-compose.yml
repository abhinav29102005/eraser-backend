version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: eraser-postgres
    environment:
      POSTGRES_USER: eraser_user
      POSTGRES_PASSWORD: eraser_pass
      POSTGRES_DB: eraser_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eraser_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eraser-network

  redis:
    image: redis:7-alpine
    container_name: eraser-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - eraser-network

  app:
    build: .
    container_name: eraser-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://eraser_user:eraser_pass@postgres:5432/eraser_db?schema=public
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - eraser-network

volumes:
  postgres_data:
  redis_data:

networks:
  eraser-network:
    driver: bridge
